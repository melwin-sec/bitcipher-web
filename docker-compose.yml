services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      FLASK_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SCRYPT_N: ${SCRYPT_N:-131072}
      SCRYPT_R: ${SCRYPT_R:-8}
      SCRYPT_P: ${SCRYPT_P:-1}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:5000
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped
